spring:
  application:
    name: chatbot
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: llama3.1:8b
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        dimensions: 768
        initialize-schema: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supportbot}
    username: bot
    password: bot